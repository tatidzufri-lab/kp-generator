schema_version: "1.1"
name: ru-call-notes-mock
expected_outcome: |
  Из рассказа о созвоне собран бриф: компания «Гараж 77», контакт Олег, отрасль автосервис,
  задача словами клиента, бюджет около 40 000 ₽, срок к Новому году, Google Таблица в заметках,
  язык ru. Генерация запущена в mock-режиме (без API), получен PDF. В ответе путь к PDF,
  сумма и срок, и ясно сказано, что это mock-заготовка, а не КП для клиента.
