# Профиль исполнителя: Татьяна Дзюбас.
# Тон, правила текста и палитра — по Tone of Voice от 14.11.2026.
# Структура КП и опциональные блоки — по шаблону КП, переписаны под ToV.
# Кейсы — в tatiana.cases.yaml (генерируется scripts/import_cases.py).

id: tatiana
demo: false
cases_file: tatiana.cases.yaml

executor:
  name:
    ru: Татьяна Дзюбас
    en: Tetiana Dziubas
  title:
    ru: AI-инженер по автоматизации
    en: AI automation engineer
  tagline:
    ru: Делаю Telegram-ботов, RAG-ассистентов и LLM-агентов, которые снимают рутину с небольших команд
    en: I build Telegram bots, RAG assistants and LLM agents that take routine work off small teams
  contacts:
    email: tatidzufri@gmail.com
    site: https://tatidzufri.com
    cases_url:
      ru: https://tatidzufri.com/cases
      en: https://tatidzufri.com/en/cases

brand:
  primary: "#1F364D"
  accent: "#F2A541"
  background: "#FAF8F4"
  text: "#1A1A1A"
  heading_font: Space Grotesk
  body_font: Inter

voice:
  tone:
    ru: >-
      Инженер-практик на встрече с клиентом: собранно и по делу, от первого лица.
      Тепло и прямо, без снисходительности. Термин для бизнеса поясняется в двух-трех словах.
      Живой разговорный язык специалиста, без канцелярита и лишних англицизмов.
    en: >-
      A hands-on engineer meeting a client: focused, first person, plain English.
      Short sentences, active voice, contractions are fine. Warm and direct.
      Explain a technical term in two or three words when the reader is a business owner.
  rules:
    ru:
      - Каждое утверждение держится на факте из брифа или из профиля. Цифр, которых нет в брифе или в кейсах, не писать.
      - «Цель» пересказывает слова заказчика, а не оценку исполнителя.
      - «Решение» — конкретные модули и функции по задаче клиента, без общих слов про автоматизацию.
      - Абзац — одно-три предложения. Предложения разной длины.
      - Без хайпа и обещаний без факта. Не писать «я профессионал», «гарантирую качество», «большой опыт».
      - Не строить фразы по шаблону «не X, а Y», «из X в Y», «дело не в X, а в Y».
      - Без перечислений тройками ради ритма и без одинаково построенных пунктов списка.
      - Без итоговой фразы в конце и без дежурного вопроса к читателю.
    en:
      - Every claim rests on a fact from the brief or the profile. No numbers that aren't in the brief or the cases.
      - The goal section restates the client's own words, not the engineer's opinion.
      - The solution lists concrete modules and features for this client, not generic talk about automation.
      - One to three sentences per paragraph. Vary sentence length.
      - No hype and no promises without a fact behind them. Never write "I'm a professional", "I guarantee quality", "extensive experience".
      - Don't build sentences on "not X, but Y" or "from X to Y" patterns.
      - No lists of three for rhythm, no list items built the same way.
      - No summary line at the end and no generic question to the reader.
      - Communication is written-first and async. Calls only on request. Never promise regular calls in English.
  stop_phrases:
    ru:
      - революция
      - революционн
      - game-changer
      - ИИ заменит
      - это не просто тренд
      - очень мощный инструмент
      - опережают конкурентов
      - только сегодня
      - бесплатная консультация
      - давайте разберемся
      - важно отметить
      - ключевой
      - в мире, где
      - реально работает
      - игра меняется
      - я профессионал
      - гарантирую качество
      - большой опыт
      - осуществляется
      - данный
      - AI-специалист
      - эксперт по нейросетям
    en:
      - revolution
      - game-changer
      - game changer
      - cutting-edge
      - unlock
      - leverage
      - seamless
      - in today's world
      - it's important to note
      - let's dive in
      - dear colleagues
      - free consultation
      - I'm a professional
      - I guarantee quality
      - extensive experience
      - AI expert
  forbid_yo: true
  forbid_emoji: true
  max_long_dashes: 2
  word_limit: [250, 400]

services:
  ru:
    - Telegram-боты с LLM
    - RAG-ассистенты по базе знаний
    - LLM-агенты и многоагентные системы
    - парсинг и мониторинг сайтов
    - генерация документов и отчетов (PDF, Word, PowerPoint)
    - автоматизация работы с отзывами и контентом
  en:
    - Telegram bots with LLMs
    - RAG assistants over a knowledge base
    - LLM agents and multi-agent setups
    - web scraping and site monitoring
    - document and report generation (PDF, Word, PowerPoint)
    - automation for reviews and content

