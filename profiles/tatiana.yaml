# Уровни сложности этапа. Часы и токены для каждого уровня — в .env (см. README, «Как считается стоимость»).
tiers:
  S:
    ru: Простой модуль на готовых библиотеках, один источник данных, одна роль пользователя. Например, бот с меню и ответами LLM, скрипт выгрузки, парсер одного сайта.
    en: A simple module on standard libraries, one data source, one user role. For example a menu bot with LLM replies, an export script, a scraper for one site.
  M:
    ru: Модуль с LLM и собственными данными или одной внешней интеграцией. Например, RAG по базе знаний, генератор документов по шаблону, бот с записью в CRM или таблицу.
    en: A module with an LLM plus your own data or one external integration. For example RAG over a knowledge base, a document generator, a bot that writes to a CRM or spreadsheet.
  L:
    ru: Несколько связанных сервисов, веб-интерфейс, несколько интеграций или ролей, деплой с базой данных. Например, платформа мониторинга, многоагентный ассистент с админкой.
    en: Several connected services, a web interface, multiple integrations or roles, deployment with a database. For example a monitoring platform or a multi-agent assistant with an admin panel.

terms:
  included:
    ru:
      - Разработка и деплой
      - Исходный код переходит в вашу собственность
      - Инструкция по работе с системой
      - 14 дней поддержки после сдачи
    en:
      - Development and deployment
      - You own the source code
      - A guide to using the system
      - 14 days of support after handover
  excluded:
    ru:
      - Сервер или хостинг оплачиваются отдельно
      - API-ключи (OpenAI, Telegram и другие) оформляются на ваш аккаунт, расход токенов в работе системы идет с него
    en:
      - Server or hosting is paid separately
      - API keys (OpenAI, Telegram and others) are set up on your account, and the system's token usage is billed there
  payment_options:
    - id: prepay_50
      text:
        ru: 50% предоплата, 50% после сдачи
        en: 50% upfront, 50% on delivery
      hint: По умолчанию.
    - id: by_stage
      text:
        ru: Оплата по этапам, после сдачи каждого
        en: Pay per stage, after each one is delivered
      hint: Если клиент против предоплаты или проект из трех-четырех этапов. Не спорить с отказом от предоплаты.
  next_step_fixed:
    ru:
      - Согласовать условия или подписать договор
    en:
      - Agree on terms or sign a contract

optional_blocks:
  - id: guarantees
    title:
      ru: Как я работаю
      en: How I work
    text:
      ru: Работаю итерациями и показываю результат после каждого этапа. Исходный код передаю вам, так что вы не привязаны ко мне как к единственному исполнителю.
      en: I work in iterations and show you a result after every stage. You get the source code, so you're never locked in to me.
    when: Клиент осторожный, проект крупный, или в брифе есть опасения насчет подрядчиков.
  - id: direct
    title:
      ru: Работа напрямую
      en: Working with me directly
    text:
      ru: Вы общаетесь с тем, кто пишет код, без менеджеров между нами. За каждый этап отвечаю я сама и на субподряд задачу не передаю.
      en: You talk to the person who writes the code, with no account managers in between. I'm responsible for every stage and I don't subcontract.
    when: Клиент сравнивает с агентствами или крупными подрядчиками.
  - id: limitations
    title:
      ru: Что для меня новое
      en: What's new for me
    text:
      ru: С {detail} я буду работать впервые. Архитектуру понимаю, время на изучение особенностей уже заложено в план, на срок это не повлияет.
      en: This will be my first project with {detail}. I understand the architecture, and time to learn its specifics is already in the plan, so the deadline doesn't change.
    when: В задаче есть технология другого класса, которой нет ни в стеке кейсов, ни в skills (например, мобильное приложение, 1С, голосовая телефония). Еще один сервис с REST API сюда не относится. В detail — название технологии.
  - id: mvp_first
    title:
      ru: Начать с MVP
      en: Start with an MVP
    text:
      ru: "Предлагаю начать с MVP: {detail}. Вы проверите систему на своих данных до того, как вкладываться в полную версию."
      en: "I suggest we start with an MVP: {detail}. You'll test the system on your own data before paying for the full version."
    when: Клиент хочет снизить риск, бюджет меньше оценки, или задача размыта. В detail — что входит в минимальную версию.
